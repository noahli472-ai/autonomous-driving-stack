[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adstack"
version = "1.0.0"
description = "Compact autonomous driving stack: vehicle models, EKF localisation, Hybrid A* / Frenet planning, Pure Pursuit / Stanley / MPC control"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Noah Lindner"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "osqp>=0.6.3", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["adstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, docstrings (public API), type hints
select = ["E", "F", "W", "I", "B", "UP", "D1", "ANN001", "ANN002", "ANN003", "ANN201", "ANN204",
          "ANN205", "ANN206"]
# D105/D107: magic methods and __init__ are documented in the class docstring.
# E741: single-letter physics symbols such as `l` (length) are intentional.
ignore = ["D105", "D107", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D", "ANN"]
"scripts/*" = ["D", "ANN"]
